[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "insilico-peptide-toolkit"
version = "0.1.0"
description = "In-silico biophysical modeling, mutational screening, and multi-omic profiling toolkit for bioactive peptides."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Juan José Álvarez", email = "juanjo.alvarez@elevate-biotech.com" }
]
keywords = [
    "peptide-design",
    "computational-biology",
    "biophysics",
    "alanine-scanning",
    "alphafold",
    "uniprot",
    "chembl",
    "drug-discovery",
    "bioinformatics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed"
]
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
insilico-peptide = "insilico_peptide.cli.main:main"

[project.urls]
Homepage = "https://github.com/Juanj053/insilico-peptide-toolkit"
Documentation = "https://github.com/Juanj053/insilico-peptide-toolkit#readme"
Repository = "https://github.com/Juanj053/insilico-peptide-toolkit.git"
Issues = "https://github.com/Juanj053/insilico-peptide-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/insilico_peptide"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

